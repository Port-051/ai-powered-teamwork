<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="812" viewBox="0 0 1040 812" font-family="'Pretendard','Noto Sans KR','Malgun Gothic',sans-serif">
  <defs>
    <style>
      .title{font-size:26px;font-weight:800;fill:#171A22}
      .subtitle{font-size:14px;font-weight:500;fill:#5A6072}
      .layerlabel{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#8A90A2}
      .blocktitle{font-size:18px;font-weight:800;fill:#171A22}
      .blockdesc{font-size:13px;font-weight:500;fill:#464B5C}
      .whitetitle{font-size:18px;font-weight:800;fill:#FFFFFF}
      .whitedesc{font-size:12.5px;font-weight:500;fill:#EEF0FA}
      .pill{font-size:12.5px;font-weight:700;fill:#3B4256}
      .flowlabel{font-size:12px;font-weight:600;fill:#5A6072}
      .tag{font-size:11px;font-weight:800;letter-spacing:1px}
      .badge{font-size:12px;font-weight:700;fill:#FFFFFF}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9BA1B2"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E0863C"/>
    </marker>
  </defs>

  <rect width="1040" height="812" fill="#FAF9F6"/>

  <!-- Header -->
  <text x="52" y="52" class="title">TeamBrain — 개인 지능 · 팀 지능 아키텍처</text>
  <text x="52" y="78" class="subtitle">멘션 한 번에 두 종류의 지능이 동시에 쌓인다 · 우리가 새로 만드는 건 가운데 한 층뿐</text>

  <!-- ===== Top: members ===== -->
  <g>
    <rect x="360" y="104" width="320" height="52" rx="26" fill="#FFFFFF" stroke="#E2E1DC" stroke-width="1.5"/>
    <text x="520" y="136" text-anchor="middle" class="blocktitle">👥  팀원들</text>
  </g>
  <text x="536" y="182" class="flowlabel">@ai 멘션</text>
  <line x1="520" y1="156" x2="520" y2="196" stroke="#9BA1B2" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ===== Layer 1: Messenger ===== -->
  <g>
    <rect x="52" y="200" width="936" height="92" rx="16" fill="#EAF0F2" stroke="#CBD9DE" stroke-width="1.5"/>
    <rect x="52" y="200" width="6" height="92" rx="3" fill="#5B7186"/>
    <text x="76" y="228" class="layerlabel">SELF-HOSTED MESSENGER</text>
    <text x="76" y="256" class="blocktitle">Mattermost <tspan class="blockdesc" font-weight="600">(순정 · 자체 호스팅)</tspan></text>
    <text x="76" y="279" class="blockdesc">비개발자 진입점 · 모든 대화가 팀 소유 서버에만 남는다</text>
    <g transform="translate(760,224)">
      <rect x="0" y="0" width="204" height="44" rx="10" fill="#5B7186"/>
      <text x="102" y="27" text-anchor="middle" class="badge">🔒 데이터 주권 확보</text>
    </g>
  </g>

  <!-- connector API -->
  <line x1="520" y1="292" x2="520" y2="330" stroke="#9BA1B2" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(556,300)">
    <rect x="0" y="0" width="230" height="24" rx="12" fill="#FFFFFF" stroke="#CBD9DE" stroke-width="1.2"/>
    <text x="14" y="16" class="pill">공개 API (REST / WebSocket) 만 사용</text>
  </g>

  <!-- ===== Layer 2: Our original layer (Team Intelligence) ===== -->
  <g>
    <rect x="52" y="334" width="936" height="176" rx="16" fill="#414FC0"/>
    <rect x="52" y="334" width="6" height="176" rx="3" fill="#2C368F"/>
    <text x="76" y="362" class="layerlabel" fill="#C7CDF3">★ OUR ORIGINAL LAYER — 팀 협업 지능 (별도 프로세스)</text>

    <!-- ① adapter -->
    <g transform="translate(76,378)">
      <rect x="0" y="0" width="264" height="112" rx="12" fill="#FFFFFF"/>
      <text x="18" y="34" class="tag" fill="#414FC0">①  어댑터</text>
      <text x="18" y="60" class="blocktitle">메신저 어댑터</text>
      <text x="18" y="85" class="blockdesc">멘션 · 스레드 · 채널</text>
      <text x="18" y="103" class="blockdesc">UX 연결</text>
    </g>

    <!-- ② team shared intelligence (highlighted core) -->
    <g transform="translate(388,378)">
      <rect x="0" y="0" width="264" height="112" rx="12" fill="#FFF4E7" stroke="#E0863C" stroke-width="2.5"/>
      <text x="18" y="34" class="tag" fill="#C56A1E">②  핵심 · NOVEL</text>
      <text x="18" y="60" class="blocktitle">팀 공유 지능</text>
      <text x="18" y="85" class="blockdesc">팀 전체가 공유하는 하나의</text>
      <text x="18" y="103" class="blockdesc">"두뇌" — 결정·노하우 축적</text>
    </g>

    <!-- ③ bridge -->
    <g transform="translate(700,378)">
      <rect x="0" y="0" width="264" height="112" rx="12" fill="#FFFFFF"/>
      <text x="18" y="34" class="tag" fill="#414FC0">③  브릿지</text>
      <text x="18" y="60" class="blocktitle">개인 ↔ 팀 브릿지</text>
      <text x="18" y="85" class="blockdesc">권한 · 비밀정보 필터:</text>
      <text x="18" y="103" class="blockdesc">무엇을 팀에 올릴지 결정</text>
    </g>
  </g>

  <!-- bidirectional connector between layer2 and layer3 -->
  <line x1="500" y1="510" x2="500" y2="556" stroke="#9BA1B2" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="540" y1="556" x2="540" y2="510" stroke="#E0863C" stroke-width="2" marker-end="url(#arrowUp)"/>
  <text x="560" y="537" class="flowlabel">필터 통과분만 개인 → 팀 승격</text>

  <!-- ===== Layer 3: Personal learning engine ===== -->
  <g>
    <rect x="52" y="560" width="936" height="150" rx="16" fill="#FCEFE0" stroke="#EBC79C" stroke-width="1.5"/>
    <rect x="52" y="560" width="6" height="150" rx="3" fill="#E0863C"/>
    <text x="76" y="588" class="layerlabel" fill="#B9761F">PERSONAL LEARNING ENGINE</text>
    <text x="76" y="616" class="blocktitle">개인 학습 엔진 <tspan class="blockdesc" font-weight="600">(Hermes 포크 · MIT)</tspan></text>
    <text x="76" y="639" class="blockdesc">팀원 각자에게 1개씩 · 세션을 넘는 기억 · 사용자 모델링 · 자기개선</text>

    <!-- three personal agents -->
    <g transform="translate(76,656)">
      <rect x="0" y="0" width="270" height="40" rx="10" fill="#FFFFFF" stroke="#EBC79C" stroke-width="1.3"/>
      <text x="16" y="26" class="pill">🧠 김동연의 개인 AI</text>
    </g>
    <g transform="translate(360,656)">
      <rect x="0" y="0" width="270" height="40" rx="10" fill="#FFFFFF" stroke="#EBC79C" stroke-width="1.3"/>
      <text x="16" y="26" class="pill">🧠 신홍재의 개인 AI</text>
    </g>
    <g transform="translate(644,656)">
      <rect x="0" y="0" width="270" height="40" rx="10" fill="#FFFFFF" stroke="#EBC79C" stroke-width="1.3"/>
      <text x="16" y="26" class="pill">🧠 여운호의 개인 AI</text>
    </g>
  </g>

  <!-- footer note -->
  <text x="52" y="748" class="blockdesc" fill="#5A6072">▸ <tspan font-weight="800" fill="#E0863C">개인 지능</tspan> = 나를 학습하는 각자의 AI (맨 아래층)   ·   <tspan font-weight="800" fill="#414FC0">팀 지능</tspan> = 필터를 통과한 지식만 공유되는 팀 공동 두뇌 (②)   ·   Mattermost·Hermes는 그대로 두고 ①②③만 새로 만든다</text>
  <text x="52" y="772" class="subtitle" fill="#8A90A2">Port_051 · TeamBrain · 공개 API로만 연결된 별도 프로세스 → 라이선스(AGPL) 의무 회피 · 데이터 주권 유지</text>
</svg>
