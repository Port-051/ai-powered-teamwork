services:
  postgres:
    image: postgres:15-alpine
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmuser_password
      POSTGRES_DB: mattermost
    volumes:
      - mm_db:/var/lib/postgresql/data

  mattermost:
    image: mattermost/mattermost-team-edition:latest
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmuser_password@postgres:5432/mattermost?sslmode=disable"
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW: "false"
    ports:
      - "8065:8065"
    volumes:
      - mm_data:/mattermost/data
      - mm_logs:/mattermost/logs
      - mm_config:/mattermost/config
      - mm_plugins:/mattermost/plugins

volumes:
  mm_db:
  mm_data:
  mm_logs:
  mm_config:
  mm_plugins:
